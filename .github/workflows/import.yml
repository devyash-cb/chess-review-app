name: Fetch and Unzip Drive File

on:
  workflow_dispatch: 

jobs:
  build-and-extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install gdown
        # pipx is the safest way to install Python CLI tools on modern Ubuntu runners
        run: pipx install gdown

      - name: Download Zip file from Google Drive
        run: |
          # gdown automatically handles the Google Drive virus scan prompt
          gdown "https://drive.google.com/uc?id=1wVfsM3JIUw8NEN4OczAC7v3cV48iz7B0" -O archive.zip

      - name: Create index folder and Unzip
        run: |
          mkdir -p index
          unzip archive.zip -d index/
          rm archive.zip

      - name: Verify extracted contents
        run: |
          echo "Listing contents of the index folder:"
          ls -la index/
