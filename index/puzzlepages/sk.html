<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skipped Replay · Chess Review</title>
<link rel="stylesheet" href="../styles.css">
<style>
    :root { --sq-light: #ebecd0; --sq-dark: #739552; --move-duration: 0.3s; }
    body { padding: 10px; }
    
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); margin-bottom: 15px; border-radius: 8px;}
    .topbar-center h1 { margin: 0; font-size: 16px; }
    .icon-btn { background: transparent; border: none; color: #fff; font-size: 20px; cursor: pointer; text-decoration: none; padding: 0; }

    #sk-container { display: flex; flex-direction: column; width: 100%; max-width: 500px; margin: 0 auto; }
    
    .board-layout-wrapper { display: flex; align-items: center; justify-content: center; width: 100%; max-width: 500px; height: auto; max-height: 55vh; margin: 0 auto 15px auto; }
    .chessboard-wrapper { width: 100%; height: 100%; aspect-ratio: 1/1; max-height: 55vh; max-width: 55vh; position: relative; border: 2px solid var(--line); border-radius: 6px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.4); cursor: pointer; }
    
    .chessboard { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; height: 100%; z-index: 1; position: relative;}
    .square { position: relative; display: flex; align-items: center; justify-content: center; }
    .square.light { background-color: var(--sq-light); }
    .square.dark { background-color: var(--sq-dark); }
    
    .coord-rank { position: absolute; top: 2px; left: 3px; font-size: 10px; font-weight: 800; z-index: 2; pointer-events: none; }
    .coord-file { position: absolute; bottom: 1px; right: 3px; font-size: 10px; font-weight: 800; z-index: 2; pointer-events: none; }
    .light .coord-text { color: var(--sq-dark); opacity: 0.8;}
    .dark .coord-text { color: var(--sq-light); opacity: 0.8;}

    .highlight-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.6; z-index: 1; display: none; }
    .legal-dot { position: absolute; width: 32%; height: 32%; background: rgba(0,0,0,0.25); border-radius: 50%; z-index: 6; pointer-events: none; }
    .piece-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    .piece { position: absolute; width: 12.5%; height: 12.5%; background-size: 95%; background-repeat: no-repeat; background-position: center; transition: transform var(--move-duration) ease-in-out, opacity 0.2s ease; pointer-events: none; }
    .badge-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    .floating-badge { position: absolute; width: 22px; height: 22px; margin-top: -6px; margin-left: -6px; z-index: 10; background: transparent; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); transition: transform var(--move-duration) ease-in-out;}
    
    .c-best, .c-excellent { background-color: #84cc16; }
    .c-brilliant { background-color: #1cb0a6; }
    .c-miss { background-color: #ec4899; }
    
    .slider-wrapper { display: flex; align-items: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 4px; gap: 4px; margin-bottom: 15px;}
    .move-slider { flex: 1; display: flex; overflow-x: auto; scroll-behavior: smooth; gap: 10px; padding: 6px; scrollbar-width: none; }
    .move-slider::-webkit-scrollbar { display: none; }
    .move-pair { display: flex; align-items: center; gap: 6px; background: #0c0a11; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); flex-shrink: 0; }
    .move-num { color: var(--muted); font-size: 12px; font-weight: bold; width: 18px; }
    .move-ply { display: flex; align-items: center; gap: 4px; color: #fff; font-size: 13px; font-weight: bold; cursor: pointer; padding: 4px; border-radius: 4px; transition: background 0.2s; }
    .move-ply:active, .move-ply.active { background: #332d42; color: var(--purple); }
    .mc-icon { width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; }

    .action-btn { background: var(--panel2); border: 1px solid var(--line); padding: 14px; border-radius: 8px; color: #fff; cursor: pointer; text-align: center; font-size: 15px; transition: background 0.2s; font-weight: bold; flex: 1;}
    .action-btn:active { background: var(--purple); border-color: var(--purple); }

    .spinner { width: 40px; height: 40px; border: 4px solid var(--line); border-top: 4px solid var(--purple); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .hidden { display: none !important; }
</style>
</head>
<body>

<div style="max-width: 500px; margin: 0 auto;">
    <header class="topbar">
        <a class="icon-btn" href="../puzzle.html" id="btnBack">←</a>
        <div class="topbar-center"><h1>Skipped Replay</h1></div>
        <div style="width:20px;"></div>
    </header>
</div>

<div id="sk-container">
    <div style="text-align:center; padding:40px;" id="loadingState">
        <div class="spinner"></div>
        <h3 style="color:var(--purple); margin:0;">Opening Archive...</h3>
    </div>
</div>

<script src="../debugger.js"></script>
<script src="pstore.js"></script>
<script src="pbin.js"></script>

<script type="module">
import { PuzzleBoard } from './pboard.js';

let skState = {
    queue: [],
    keysList: [],
    keyPointer: 0,
    activePuzzle: null
};

let currentPuzzle = null;
let hintState = 0; 
let sessionFirstPuzzle = !sessionStorage.getItem("skReady"); // Memory Check

document.addEventListener("DOMContentLoaded", async () => {
    const savedState = await getDB("m10pda");
    if (savedState) {
        skState = savedState;
    } else {
        const skips = await getDB("skippedArchive") || {};
        skState.keysList = Object.keys(skips);
        skState.keysList.sort(() => Math.random() - 0.5);
        await setDB("m10pda", skState);
    }

    if (skState.keysList.length === 0) {
        await setDB("m10pda", null);
        document.getElementById("sk-container").innerHTML = `
            <div style="text-align:center; padding:50px 20px;">
                <h2 style="color:#84cc16; margin:0 0 10px 0;">Archive Empty!</h2>
                <p class="muted" style="line-height:1.5; margin-bottom:25px;">You have no skipped puzzles pending. Great resilience!</p>
                <button class="action-btn" style="width:100%; background:var(--purple); border-color:var(--purple);" onclick="window.location.href='../puzzle.html'">Back to Menu</button>
            </div>
        `;
        return;
    }

    await buildSKQueue();
    loadNextSKPuzzle();
});

async function buildSKQueue() {
    let added = false;
    while(skState.queue.length < 3 && skState.keyPointer < skState.keysList.length) {
        const key = skState.keysList[skState.keyPointer];
        skState.keyPointer++;

        const parts = key.split('_');
        const isReserve = parts[0] === "res";
        
        try {
            let pData = null;
            if (isReserve) {
                pData = await extractPuzzleData("reserve", "1200", parseInt(parts[1]));
            } else {
                const tName = THEMES[parseInt(parts[0])];
                const tier = parts[1];
                const rIdx = parseInt(parts[2]);
                pData = await extractPuzzleData(tName, tier, rIdx);
            }

            if (pData) {
                pData.archiveKey = key;
                skState.queue.push(pData);
                added = true;
            }
        } catch(e) {}
    }
    if (added) await setDB("m10pda", skState);
}

window.applyHint = async () => {
    let ab = window.activeBoard;
    if(!ab || ab.currentPly >= ab.solutionMoves.length) return;

    if(currentPuzzle) currentPuzzle.usedAssistance = true;
    let expected = ab.solutionMoves[ab.currentPly];
    let fromSq = expected.substring(0, 2);

    if(hintState === 0) {
        let hl = document.getElementById(`hl-${fromSq}`);
        if(hl) {
            hl.style.display = "block";
            hl.style.backgroundColor = "rgba(234, 179, 8, 0.6)"; 
        }
        const btn = document.getElementById("btnHint");
        if(btn) btn.innerText = "Show Move 💡";
        hintState = 1;
    } else if(hintState === 1) {
        ab.drawZenArrow(expected);
        const btn = document.getElementById("btnHint");
        if(btn) btn.disabled = true; 
    }
};

window.retryMove = () => {
    window.activeBoard.undoLastMove();
    hintState = 0;
    document.getElementById("action-container").innerHTML = `
        <button id="btnHint" class="action-btn" onclick="window.applyHint()">Hint 💡</button>
        <button class="action-btn" onclick="window.skipPuzzle()">Skip & Next ⏭️</button>
    `;
};

window.skipPuzzle = async () => {
    await logPuzzleResult(10, 2, currentPuzzle.t, currentPuzzle.tier, currentPuzzle.i, window.activeBoard.getElapsedTime());
    window.advanceToNextPuzzle();
};

window.advanceToNextPuzzle = async () => {
    skState.activePuzzle = null; 
    await setDB("m10pda", skState);
    loadNextSKPuzzle();
};

async function loadNextSKPuzzle() {
    if (skState.activePuzzle) {
        currentPuzzle = skState.activePuzzle;
    } else {
        if (skState.queue.length === 0 && skState.keyPointer >= skState.keysList.length) {
            await setDB("m10pda", null);
            document.getElementById("sk-container").innerHTML = `
                <div style="text-align:center; padding:50px 20px;">
                    <h2 style="color:var(--purple); margin:0 0 10px 0;">Review Complete</h2>
                    <p class="muted" style="line-height:1.5; margin-bottom:25px;">You've cycled through your skipped puzzles for this session.</p>
                    <button class="action-btn" style="width:100%; background:var(--purple); border-color:var(--purple);" onclick="window.location.href='../puzzle.html'">Back to Menu</button>
                </div>
            `;
            return;
        }
        currentPuzzle = skState.queue.shift();
        currentPuzzle.usedAssistance = false; 
        skState.activePuzzle = currentPuzzle;
        await setDB("m10pda", skState);
        buildSKQueue(); 
    }

    const themeStr = THEMES[currentPuzzle.t] || "Tactics";
    const totalMoves = Math.ceil(currentPuzzle.m.split(' ').length / 2);
    const remainingCount = (skState.keysList.length - skState.keyPointer) + skState.queue.length + 1;
    hintState = 0;

    window.activeBoard = new PuzzleBoard("sk-container", {
        isFirstPuzzle: sessionFirstPuzzle,
        themeHidden: false, 
        themeName: themeStr,
        puzzleData: currentPuzzle,
        blindLevel: 0,
        topBar: { labelLeft: "Moves", valLeft: totalMoves, labelRight: "Remaining", valRight: remainingCount },
        actions: [
            { id: "btnHint", label: "Hint 💡", class: "action-btn", onClick: () => window.applyHint() },
            { label: "Skip & Next ⏭️", class: "action-btn", onClick: () => window.skipPuzzle() }
        ],
        onComplete: async (timeMs) => {
            if (currentPuzzle.usedAssistance) await logPuzzleResult(10, 1, currentPuzzle.t, currentPuzzle.tier, currentPuzzle.i, timeMs);
            else await logPuzzleResult(10, 0, currentPuzzle.t, currentPuzzle.tier, currentPuzzle.i, timeMs);
            document.getElementById("action-container").innerHTML = `<button class="action-btn" style="background:var(--purple); border-color:var(--purple);" onclick="window.advanceToNextPuzzle()">Next Puzzle</button>`;
        },
        onFail: async (timeMs) => {
            if(!currentPuzzle.usedAssistance) {
                currentPuzzle.usedAssistance = true;
                await logPuzzleResult(10, 1, currentPuzzle.t, currentPuzzle.tier, currentPuzzle.i, timeMs);
            }
            document.getElementById("action-container").innerHTML = `
                <button class="action-btn" onclick="window.activeBoard.playSolution()">Show Solution</button>
                <button class="action-btn" style="background:var(--purple); border-color:var(--purple);" onclick="window.retryMove()">Retry ↩️</button>
            `;
        }
    });

    document.getElementById("pb-board-area").addEventListener('click', () => {
        if (hintState === 1) {
            hintState = 0;
            const btn = document.getElementById('btnHint');
            if (btn) { btn.innerText = 'Hint 💡'; btn.disabled = false; }
        }
    });

    sessionFirstPuzzle = false; 
    sessionStorage.setItem("skReady", "true");
}
</script>
</body>
</html>
