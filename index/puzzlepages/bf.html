<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Under Construction</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{display:flex;align-items:center;justify-content:center;height:100vh;margin:0;padding:20px;box-sizing:border-box;}
.card{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:40px 24px;text-align:center;max-width:380px;width:100%;box-shadow:0 8px 24px rgba(0,0,0,0.4);}
.icon{font-size:72px;line-height:1;margin-bottom:20px;}
.msg{font-size:16px;color:var(--muted);line-height:1.5;margin-bottom:30px;font-weight:700;}
.ret-btn{background:var(--purple);border:1px solid var(--purple);color:#fff;padding:14px;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;text-decoration:none;display:block;width:100%;box-sizing:border-box;}
.ret-btn:active{opacity:0.8;transform:scale(0.98);}
</style>
</head>
<body>
<div class="card">
<div class="icon">🛑</div>
<div class="msg">This page is currently in built progress and would be available in the next update!</div>
<a href="../puzzle.html" class="ret-btn">Return</a>
</div>
</body>
</html>
