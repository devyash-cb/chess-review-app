<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3 Strike Run · Chess Review</title>
<link rel="stylesheet" href="../styles.css">
<style>
    :root { --sq-light: #ebecd0; --sq-dark: #739552; --move-duration: 0.3s; }
    body { padding: 10px; }
    
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); margin-bottom: 15px; border-radius: 8px;}
    .topbar-center h1 { margin: 0; font-size: 16px; }
    .icon-btn { background: transparent; border: none; color: #fff; font-size: 20px; cursor: pointer; text-decoration: none; padding: 0; }

    #l3-container { display: flex; flex-direction: column; width: 100%; max-width: 500px; margin: 0 auto; }
    
    .board-layout-wrapper { display: flex; align-items: center; justify-content: center; width: 100%; max-width: 500px; height: auto; max-height: 55vh; margin: 0 auto 15px auto; }
    .chessboard-wrapper { width: 100%; height: 100%; aspect-ratio: 1/1; max-height: 55vh; max-width: 55vh; position: relative; border: 2px solid var(--line); border-radius: 6px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.4); cursor: pointer; }
    
    .chessboard { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; height: 100%; z-index: 1; position: relative;}
    .square { position: relative; display: flex; align-items: center; justify-content: center; }
    .square.light { background-color: var(--sq-light); }
    .square.dark { background-color: var(--sq-dark); }
    
    .coord-rank { position: absolute; top: 2px; left: 3px; font-size: 10px; font-weight: 800; z-index: 2; pointer-events: none; }
    .coord-file { position: absolute; bottom: 1px; right: 3px; font-size: 10px; font-weight: 800; z-index: 2; pointer-events: none; }
    .light .coord-text { color: var(--sq-dark); opacity: 0.8;}
    .dark .coord-text { color: var(--sq-light); opacity: 0.8;}

    .highlight-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.6; z-index: 1; display: none; }
    .legal-dot { position: absolute; width: 32%; height: 32%; background: rgba(0,0,0,0.25); border-radius: 50%; z-index: 6; pointer-events: none; }
    .piece-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    .piece { position: absolute; width: 12.5%; height: 12.5%; background-size: 95%; background-repeat: no-repeat; background-position: center; transition: transform var(--move-duration) ease-in-out, opacity 0.2s ease; pointer-events: none; }
    .badge-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    .floating-badge { position: absolute; width: 22px; height: 22px; margin-top: -6px; margin-left: -6px; z-index: 10; background: transparent; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); transition: transform var(--move-duration) ease-in-out;}
    
    .c-best, .c-excellent { background-color: #84cc16; }
    .c-brilliant { background-color: #1cb0a6; }
    .c-miss { background-color: #ec4899; }
    .c-blunder { background-color: #ef4444; }
    
    .slider-wrapper { display: flex; align-items: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 4px; gap: 4px; margin-bottom: 15px;}
    .move-slider { flex: 1; display: flex; overflow-x: auto; scroll-behavior: smooth; gap: 10px; padding: 6px; scrollbar-width: none; }
    .move-slider::-webkit-scrollbar { display: none; }
    .move-pair { display: flex; align-items: center; gap: 6px; background: #0c0a11; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); flex-shrink: 0; }
    .move-num { color: var(--muted); font-size: 12px; font-weight: bold; width: 18px; }
    .move-ply { display: flex; align-items: center; gap: 4px; color: #fff; font-size: 13px; font-weight: bold; cursor: pointer; padding: 4px; border-radius: 4px; transition: background 0.2s; }
    .move-ply:active, .move-ply.active { background: #332d42; color: var(--purple); }
    .mc-icon { width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; }

    .action-btn { background: var(--panel2); border: 1px solid var(--line); padding: 14px; border-radius: 8px; color: #fff; cursor: pointer; text-align: center; font-size: 15px; transition: background 0.2s; font-weight: bold; flex: 1;}
    .action-btn:active { background: var(--purple); border-color: var(--purple); }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-box { background: var(--panel); border: 1px solid var(--line); padding: 22px; border-radius: 12px; width: 90%; max-width: 340px; text-align: center; max-height:85vh; overflow-y:auto; }
    .spinner { width: 40px; height: 40px; border: 4px solid var(--line); border-top: 4px solid var(--purple); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .hidden { display: none !important; }
</style>
</head>
<body>

<div style="max-width: 500px; margin: 0 auto;">
    <header class="topbar">
        <a class="icon-btn" href="../puzzle.html" id="btnBack">←</a>
        <div class="topbar-center"><h1>3 Strike Run</h1></div>
        <div style="width:20px;"></div>
    </header>
</div>

<div id="l3-container">
    <div style="text-align:center; padding:40px;">
        <div class="spinner"></div>
        <h3 style="color:var(--purple); margin:0;">Loading Gauntlet...</h3>
    </div>
</div>

<!-- Game Over Modal -->
<div id="gameOverModal" class="modal-overlay hidden" style="z-index: 100000;">
    <div class="modal-box">
        <h2 style="color:#ef4444; margin:0 0 10px 0;">Run Ended</h2>
        
        <div style="font-size:12px; color:var(--muted); text-transform:uppercase; margin-bottom:4px; font-weight:800;">Puzzles Solved</div>
        <div style="color:var(--purple); font-size:48px; font-weight:900; margin-bottom:15px; line-height:1;" id="finalScore">0</div>

        <p class="muted" id="bestStreakNote" style="font-size:13px; margin-bottom:20px; font-weight:bold;"></p>
        
        <button class="action-btn" style="width:100%; margin-bottom:10px; background:var(--purple); border-color:var(--purple);" onclick="window.location.reload()">Play Again</button>
        <button class="ghost-btn" style="width:100%;" onclick="window.location.href='../puzzle.html'">Back to Menu</button>
    </div>
</div>

<script src="../debugger.js"></script>
<script src="pstore.js"></script>
<script src="pbin.js"></script>

<script type="module">
import { PuzzleBoard } from './pboard.js';

let l3State = {
    score: 0,
    bestStreak: 0, 
    lives: 3,
    queue: [],
    idx: 0,
    isGameOver: false
};

// Internal mathematical progression tracker
let gBase = 1200;
let gRating = 1200;
let gTier = 1;

// Strict memory dump on back navigation - Session inherently dies here
document.getElementById("btnBack").addEventListener("click", () => {
    l3State.queue = [];
    l3State.isGameOver = true;
});

document.addEventListener("DOMContentLoaded", async () => {
    // Pre-fetch High Score on load targeting 'm2pda' exactly as requested by puzzle.html
    const dbState = await getDB("m2pda");
    if (dbState && dbState.bestStreak) {
        l3State.bestStreak = dbState.bestStreak;
    }

    await buildStrikeQueue();
    loadNextStrikePuzzle();
});

function getHearts(lives) {
    return '♥️ '.repeat(Math.max(0, lives)) + '🖤 '.repeat(Math.max(0, 3 - lives));
}

async function buildStrikeQueue() {
    let added = 0;
    const playedSet = await getDB("playedPuzzlesSet") || {};
    const meta = await getMeta();

    // Pre-generate 100 puzzles into RAM based on assumed continuous winning progression
    while (added < 100) {
        let pData = null;
        let attempts = 0;

        while (!pData && attempts < 50) {
            attempts++;
            // 30% chance for unclassified to guarantee massive variety, 70% random theme
            let tName = Math.random() < 0.3 ? "unclassified" : THEMES[Math.floor(Math.random() * THEMES.length)];
            let tMeta = meta[tName]?.[`t${gTier}`];

            if (tMeta && tMeta.total > 0) {
                let bStr = (Math.floor(gRating / 100) * 100).toString();
                let br = tMeta.brackets[bStr];
                
                // Fallback to unclassified if the theme doesn't have puzzles at this exact Elo
                if (!br) { 
                    tName = "unclassified"; 
                    br = meta["unclassified"]?.[`t${gTier}`]?.brackets[bStr]; 
                }

                if (br) {
                    let rIdx = Math.floor(Math.random() * (br[1] - br[0] + 1)) + br[0];
                    let pKey = `${tName}_t${gTier}_${rIdx}`;
                    
                    if (!playedSet[pKey]) {
                        try {
                            pData = await extractPuzzleData(tName, gTier.toString(), rIdx);
                            playedSet[pKey] = true;
                        } catch(e) {}
                    }
                }
            }
        }

        if (pData) {
            l3State.queue.push(pData);
            added++;

            // Exact Mathematical Progression Loop
            gRating += 10;
            
            if (gTier === 1 && gRating >= gBase + 100) {
                gRating = gBase + 50; 
                gTier = 2;
            } else if (gTier === 2 && gRating >= gBase + 150) {
                gRating = gBase + 100; 
                gTier = 3;
            } else if (gTier === 3 && gRating >= gBase + 200) {
                gBase += 100; 
                gRating = gBase; 
                gTier = 1;
            }
        } else {
            // Failsafe increment if pool is extremely empty at specific tier
            gRating += 10; 
        }
    }
    
    // Save the global set so we never repeat puzzles across runs
    await setDB("playedPuzzlesSet", playedSet);
}

async function loadNextStrikePuzzle() {
    if (l3State.isGameOver) return;

    if (l3State.lives <= 0) {
        return triggerGameOver();
    }

    // Auto-refill logic: fetch 100 more if running low
    if (l3State.queue.length - l3State.idx < 10) {
        buildStrikeQueue();
    }

    if (l3State.idx >= l3State.queue.length) return triggerGameOver();

    const currentPuzzle = l3State.queue[l3State.idx];
    l3State.idx++;

    const themeStr = THEMES[currentPuzzle.t] || "Tactics";

    window.activeBoard = new PuzzleBoard("l3-container", {
        isFirstPuzzle: (l3State.idx === 1), 
        themeHidden: true,
        themeName: themeStr,
        puzzleData: currentPuzzle,
        blindLevel: 0,
        topBar: { labelLeft: "Streak", valLeft: l3State.score, labelRight: "Lives", valRight: getHearts(l3State.lives) }, 
        actions: [],
        onComplete: async (timeMs) => {
            if(l3State.isGameOver) return;
            l3State.score++;
            
            // MID-GAME BEST STREAK SYNC TO DATABASE (m2pda)
            if (l3State.score > l3State.bestStreak) {
                l3State.bestStreak = l3State.score;
                await setDB("m2pda", { bestStreak: l3State.bestStreak });
            }
            
            // Mode ID is 2 for 3-Strike Run
            await logPuzzleResult(2, 0, currentPuzzle.t, currentPuzzle.tier, currentPuzzle.i, timeMs);
            loadNextStrikePuzzle(); // Instant Next on Win!
        },
        onFail: async (timeMs) => {
            if(l3State.isGameOver) return;
            l3State.lives--;
            
            await logPuzzleResult(2, 1, currentPuzzle.t, currentPuzzle.tier, currentPuzzle.i, timeMs);
            
            // Dynamically update the hearts without reloading the entire UI
            hackHeartDisplay();

            if (l3State.lives <= 0) {
                setTimeout(() => triggerGameOver(), 1200); // Give them 1.2 seconds to stare at 0 hearts before modal drops
            } else {
                document.getElementById("action-container").innerHTML = `
                    <button class="action-btn" onclick="window.activeBoard.playSolution()">Show Solution</button>
                    <button class="action-btn" style="background:var(--purple); border-color:var(--purple);" onclick="window.loadNextStrikePuzzle()">Next ⏭️</button>
                `;
            }
        }
    });
}
window.loadNextStrikePuzzle = loadNextStrikePuzzle;

function hackHeartDisplay() {
    setTimeout(() => {
        const pCont = document.getElementById('l3-container');
        if(!pCont) return;
        const valWrappers = pCont.querySelectorAll('div[style*="font-size:16px"]');
        if (valWrappers.length >= 2) {
            valWrappers[1].innerText = getHearts(l3State.lives);
        }
    }, 10);
}

function triggerGameOver() {
    l3State.isGameOver = true;
    
    if (window.activeBoard && window.activeBoard.boardClickArea) {
        window.activeBoard.boardClickArea.style.pointerEvents = 'none';
    }

    document.getElementById("finalScore").innerText = l3State.score;
    
    // High Score is already saved in DB from the mid-game check, we just format the text here
    if (l3State.score >= l3State.bestStreak && l3State.score > 0) {
        document.getElementById("bestStreakNote").innerText = "🎉 New Best Streak!";
        document.getElementById("bestStreakNote").style.color = "#84cc16";
    } else {
        document.getElementById("bestStreakNote").innerText = `Best Streak: ${l3State.bestStreak}`;
    }

    document.getElementById("gameOverModal").classList.remove("hidden");
    l3State.queue = []; // Dump RAM immediately
}
</script>
</body>
</html>
