<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Welcome · Chess Review</title>
<link rel="stylesheet" href="styles.css">
<style>
.welcome-container{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center;padding:20px}
.welcome-title{font-size:24px;letter-spacing:0.18em;color:var(--purple);font-weight:800;margin-bottom:15px}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal-content{background:var(--panel);border:1px solid var(--line);padding:25px;border-radius:12px;width:90%;max-width:350px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.modal-content h3{margin-bottom:10px}
.modal-content input{width:100%;padding:12px;margin:15px 0;background:#0c0a11;border:1px solid var(--line);color:#fff;border-radius:6px;font-size:16px;outline:none}
.modal-content input:focus{border-color:var(--purple)}
.primary-btn{cursor:pointer}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="welcome-container page">
<div class="welcome-title">CHESS REVIEW</div>
<h2 style="margin-bottom:10px">Welcome</h2>
<p id="setupStatus" class="muted">Setting up local databases...</p>
<a id="enterAppBtn" href="home.html" class="primary-btn hidden" style="margin-top:25px;text-decoration:none">Go to Dashboard →</a>
</div>
<div id="usernameModal" class="modal-overlay hidden">
<div class="modal-content">
<h3>Chess.com Setup</h3>
<p class="muted" style="font-size:14px">Please enter your Chess.com username to fetch your games.</p>
<input type="text" id="usernameInput" placeholder="e.g. Hikaru" autocomplete="off" spellcheck="false"/>
<button id="saveUsernameBtn" class="primary-btn" style="width:100%">Save & Continue</button>
</div>
</div>
<script>
document.addEventListener("DOMContentLoaded",async()=>{
try{localStorage.removeItem("chessReviewErrorLogs");localStorage.removeItem("chessEngineLogs")}catch(e){}
try{if(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App){window.Capacitor.Plugins.App.addListener('backButton',()=>{const modal=document.getElementById("usernameModal");if(!modal.classList.contains("hidden")){window.Capacitor.Plugins.App.exitApp()}else{window.Capacitor.Plugins.App.exitApp()}})}}catch(e){}
const statusText=document.getElementById("setupStatus");
const enterBtn=document.getElementById("enterAppBtn");
const modal=document.getElementById("usernameModal");
const SETTINGS_KEY="chessReviewSettings";
try{
let settings=JSON.parse(localStorage.getItem(SETTINGS_KEY));
const detectedThreads=navigator.hardwareConcurrency||2;
if(!settings){
settings={username:"",previewLimit:8,deepDepth:detectedThreads>=8?20:(detectedThreads>=4?16:12),threads:detectedThreads,hash:64,ttsVoiceEnabled:true,moveSpeed:0.4,readingDuration:3,speechRate:1.0,activePieceSet:"Piece-set-1",iconStyle:"svg",reviewPerspective:"auto",wHexCode:"#ebecd0",bHexCode:"#739552",continuations:{brilliant:true,great:true,miss:true,inaccuracy:true,mistake:true,blunder:true}};
localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));
}
await new Promise((resolve,reject)=>{
const req=indexedDB.open("ChessReviewDB",3);
req.onupgradeneeded=()=>{
const db=req.result;
if(!db.objectStoreNames.contains("games")){
const store=db.createObjectStore("games",{keyPath:"id"});
const indexes=["playedAt","status","opening","white","black"];
for(const idx of indexes)store.createIndex(idx,idx);
}
if(!db.objectStoreNames.contains("userStats"))db.createObjectStore("userStats",{keyPath:"id"});
if(!db.objectStoreNames.contains("moveStats"))db.createObjectStore("moveStats",{keyPath:"id"});
// NEW: Added the puzzles store creation here so version 3 handles it
if(!db.objectStoreNames.contains("puzzles"))db.createObjectStore("puzzles",{keyPath:"key"});
};
req.onsuccess=()=>resolve(req.result);
req.onerror=()=>reject(req.error);
});
if(!settings.username||settings.username.trim()===""){
statusText.textContent="Waiting for configuration...";
modal.classList.remove("hidden");
document.getElementById("saveUsernameBtn").addEventListener("click",()=>{
const val=document.getElementById("usernameInput").value.trim();
if(val){
settings.username=val;
localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));
modal.classList.add("hidden");
window.location.href="home.html";
}else{alert("Username cannot be empty.");}
});
}else{
statusText.textContent="Ready!";
enterBtn.classList.remove("hidden");
setTimeout(()=>{window.location.href="home.html";},600);
}
}catch(err){
statusText.textContent=`Setup failed: ${err.message}`;
statusText.style.color="var(--red)";
}
});
</script>
</body>
</html>
